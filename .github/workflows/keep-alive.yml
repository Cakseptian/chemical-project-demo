name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 9 */3 * *'  # every 3 days at 9am UTC
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Demo
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.DEMO_SUPABASE_URL }}/rest/v1/inventory?select=id&limit=1" \
            -H "apikey: ${{ secrets.DEMO_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.DEMO_SUPABASE_ANON_KEY }}")
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Ping failed with status $STATUS"
            exit 1
          fi
          echo "✅ Supabase demo is alive"
